services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      # Optional on first clone: infra still starts without it. Copy
      # `.env.example` to `.env` and fill in real values for the app to
      # actually function (DB, NextAuth, Google OAuth, etc).
      - path: .env
        required: false
    environment:
      # Overridable so friends on other machines can reach the app: set
      # NEXTAUTH_URL to the host's reachable URL (e.g. http://<your-ip>:3000)
      # or leave unset for same-machine use.
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      # Internal Docker network address — only this container can reach
      # Judge0, since its port is never published to the host (see below).
      JUDGE0_API_URL: http://judge0-server:2358
    depends_on:
      judge0-server:
        condition: service_healthy
    # Opt-in only. Without a profile this service starts on a bare
    # `docker compose up` — which is what you run to get Judge0 — and then
    # publishes :3000 from whatever image was last built. `next dev` finds the
    # port taken, silently falls back to :3001, and localhost:3000 keeps
    # serving a frozen old build of the UI. Start it deliberately with
    #   docker compose --profile app up --build
    # and rebuild whenever you want it to reflect current source.
    profiles: ["app"]
    # NOT unless-stopped: that policy makes Docker Desktop resurrect this
    # container on every machine/daemon restart, re-taking :3000 behind your
    # back. It should only ever run because you asked for it.
    restart: "no"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/ping', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Self-hosted code execution engine (replaces the public emkc.org Piston
  # API, which went whitelist-only, and the earlier single-container Piston
  # fix). Judge0 uses the same `isolate` sandbox that runs IOI/ACM-ICPC
  # contests and is built for high-concurrency submission volume: requests
  # land in a Redis-backed queue and are drained by worker processes, so
  # throughput scales by adding workers (`docker compose up --scale
  # judge0-worker=N`) instead of redesigning the app.
  judge0-server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2358"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      judge0-db:
        condition: service_started
      judge0-redis:
        condition: service_started
    # Bound to loopback only, not "2358:2358" — Judge0's /submissions endpoint
    # has no authentication configured, so exposing it to the LAN/internet
    # would let anyone who can reach that port run arbitrary code. Binding to
    # 127.0.0.1 lets `npm run dev` (running directly on this machine, outside
    # the compose network) reach it via http://localhost:2358, while still
    # blocking every other machine on the network from reaching it.
    ports:
      - "127.0.0.1:2358:2358"

  judge0-worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: unless-stopped
    depends_on:
      - judge0-server

  # NOTE: POSTGRES_PASSWORD is only ever applied when the judge0_data volume is
  # first initialised. Editing it in judge0.conf afterwards does NOT change the
  # stored password, so judge0-server then crash-loops on
  #   FATAL: password authentication failed for user "judge0"
  # while `psql -h 127.0.0.1` from inside this container still appears to work —
  # pg_hba.conf trusts loopback, so that test gives a false pass. Reproduce the
  # real path with `-h judge0-db`, which hits the scram-sha-256 rule.
  # To resync without destroying the volume:
  #   docker exec <db> psql -U judge0 -d judge0 \
  #     -c "ALTER USER judge0 WITH PASSWORD '<value from judge0.conf>';"
  judge0-db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - judge0_data:/var/lib/postgresql/data/
    restart: unless-stopped

  judge0-redis:
    image: redis:7.2.4
    command: >
      bash -c "docker-entrypoint.sh --appendonly no --requirepass \"$$REDIS_PASSWORD\""
    env_file: judge0.conf
    restart: unless-stopped

volumes:
  judge0_data:
